[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "giclab"
version = "0.1.0"
description = "Reproducibility and contract tooling for the GIC Lab research program"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.25,<5",
  "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.26.0.20260518,<5",
  "types-pyyaml>=6.0.12.20250516",
]

[project.scripts]
giclab-validate = "giclab.validation:main"
giclab-build-site-data = "giclab.sitegen:main"

[tool.hatch.build.targets.wheel]
packages = ["src/giclab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["giclab"]
