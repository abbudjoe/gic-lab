[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "giclab"
version = "0.1.0"
description = "Reproducibility and contract tooling for the GIC Lab research program"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.25,<5",
  "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.26.0.20260518,<5",
  "types-pyyaml>=6.0.12.20250516",
]
evaluator = [
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "ftfy==6.3.1",
  "rouge-score==0.1.2",
  "spacy==3.8.11",
  "tqdm==4.67.3",
]

[project.scripts]
giclab-validate = "giclab.validation:main"
giclab-build-site-data = "giclab.sitegen:main"
giclab-harness = "giclab.harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/giclab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "private_local: opt-in assertions over private, user-owned historical evidence",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures/t09/pinned-evaluator"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["giclab"]
