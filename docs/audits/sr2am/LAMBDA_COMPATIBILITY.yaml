    target_python: CPython 3.13
    algorithm: >-
      Intersect each artifact's packaging.utils.parse_wheel_filename tags with
      packaging.tags.cpython_tags((3, 13)) plus compatible_tags((3, 13)) for
      Linux manylinux tags through glibc 2.35 and the target architecture;
      reject artifacts whose Requires-Python excludes 3.13.
