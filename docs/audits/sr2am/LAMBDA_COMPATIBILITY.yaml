  weight_gib: 15.256476372480392
  dtype: bfloat16
  layers: 36
  kv_heads: 8
  head_dim: 128
  context_tokens: 40960
  one_full_context_kv_bytes: 6039797760
  one_full_context_kv_gib: 5.625
  weights_plus_one_full_context_kv_gib: 20.881476372480392
  excluded_from_estimate:
    - CUDA graphs
    - activations
    - allocator fragmentation and reserve
    - SGLang runtime buffers
    - concurrent sequences beyond one fully occupied context
  interpretation: >-
    The arithmetic supports a conservative 40 GB static floor for TP=1,
    DP=1, concurrency=1. It is not measured peak VRAM evidence.

