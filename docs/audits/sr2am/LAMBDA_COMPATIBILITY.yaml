selection:
  preferred_accelerator: H100 PCIe 80 GB
  preferred_gpu_count: 1
  preferred_cpu_architecture: x86_64
  rationale:
    - TP=1 and DP=1 are accepted by the 8B source path.
    - 80 GB gives substantial headroom above the unmeasured 20.881 GiB lower bound.
    - x86_64 avoids five exact-pin CPython 3.13 ARM wheel gaps and the unverified sandbox image architecture.
    - PCIe is cheaper than the current one-GPU H100 SXM shape and TP=1 does not need inter-GPU fabric.
  fallback_order:
    - H100 SXM 80 GB x1 x86_64
    - A100 40 GB x1 x86_64
    - A100 80 GB x8 x86_64 only if no smaller compatible shape is available and a new budget is approved
  excluded_until_proven:
    - GH200 96 GB arm64

matrix:
  - accelerator: H100 PCIe 80 GB
    provider_shape: 1x
    cpu_architecture: x86_64
    cpu_architecture_provenance: expected-provider-shape; confirm in T11
    gpu_architecture: Hopper
    gpu_count: 1
    vram_gb_per_gpu: 80
    root_volume: 1 TiB
    current_price_usd_per_gpu_hour: 3.29
    current_total_usd_per_hour: 3.29
    source_topology: TP=1, DP=1
    static_status: preferred-pending-preflight
    compatibility_basis:
      - Hopper remains supported by current CUDA architecture documentation.
      - Core pinned SGLang, vLLM, sgl-kernel, Torch, Triton, and CuPy distributions publish x86_64 paths.
      - Model and one-full-context KV lower bound leave more than 50 GiB before other runtime allocations.
    blockers: []
    t11_gates:
      - Resolve the contradictory environment into a hash-locked source-parity serving profile.
      - Pin Lambda image ID and confirm Python, NVIDIA driver, and CUDA runtime compatibility.
      - Import-smoke SGLang and required kernels without loading the model.
      - Re-read price and availability.

  - accelerator: H100 SXM 80 GB
    provider_shape: 1x
    cpu_architecture: x86_64
    cpu_architecture_provenance: expected-provider-shape; confirm in T11
    gpu_architecture: Hopper
    gpu_count: 1
    vram_gb_per_gpu: 80
    root_volume: 2.75 TiB
    current_price_usd_per_gpu_hour: 4.29
    current_total_usd_per_hour: 4.29
    source_topology: TP=1, DP=1
    static_status: eligible-pending-preflight
    compatibility_basis:
      - Same architecture and memory capacity as the preferred H100 class.
      - Higher memory bandwidth is favorable but not required for TP=1 correctness.
    blockers: []
    t11_gates:
      - Apply every H100 PCIe environment and image gate.
      - Use only when PCIe capacity is unavailable or a measured need justifies the higher rate.

  - accelerator: GH200 96 GB
    provider_shape: 1x
    cpu_architecture: arm64
    cpu_architecture_provenance: official-provider-warning
    gpu_architecture: Hopper
    gpu_count: 1
    vram_gb_per_gpu: 96
    root_volume: 4 TiB
    current_price_usd_per_gpu_hour: 2.29
    current_total_usd_per_hour: 2.29
    source_topology: TP=1, DP=1
    static_status: arm-unproven-do-not-select
    compatibility_basis:
      - Memory is ample.
      - Core serving packages publish arm64 artifacts at the pinned versions.
      - Lambda Stack 22.04 and 24.04 list arm64 images.
    blockers:
      - Five exact pins with x86_64-compatible paths lack a CPython 3.13 arm64 path: osqp, torch_memory_saver, torchcodec, xformers, and xgrammar.
      - The unpinned SandboxFusion image has no verified arm64 manifest in this audit.
      - The full 349-line Python 3.13 snapshot was neither resolved nor import-tested on ARM.
      - Upstream and provider documentation both warn that ARM workflows require explicit validation.
    t11_gates:
      - Do not select for the first smoke unless every blocker is closed with arm64 build/import/runtime evidence.

  - accelerator: A100 SXM 80 GB
    provider_shape: 8x
    cpu_architecture: x86_64
    cpu_architecture_provenance: expected-provider-shape; confirm in T11
    gpu_architecture: Ampere
    gpu_count: 8
    vram_gb_per_gpu: 80
    root_volume: 19.5 TiB
    current_price_usd_per_gpu_hour: 2.79
    current_total_usd_per_hour: 22.32
    source_topology: TP=1, DP=8 when the upstream wrapper receives --num-gpus 8
    static_status: eligible-not-minimal
    compatibility_basis:
      - Ampere remains supported by current CUDA architecture documentation.
      - Each replica has ample VRAM.
      - The shape exactly matches the upstream eight-GPU 8B throughput example.
    blockers:
      - Current provider shape exposes eight GPUs, multiplying hourly cost and model replicas for a one-row smoke.
    t11_gates:
      - Require a separate budget decision; never select merely because its per-GPU price is lower.

  - accelerator: A100 40 GB
    provider_shapes:
      - 1x SXM
      - 1x PCIe
    cpu_architecture: x86_64
    cpu_architecture_provenance: expected-provider-shape; confirm in T11
    gpu_architecture: Ampere
    gpu_count: 1
    vram_gb_per_gpu: 40
    root_volume: 512 GiB
    current_price_usd_per_gpu_hour: 1.99
    current_total_usd_per_hour: 1.99
    source_topology: TP=1, DP=1
    static_status: eligible-pending-preflight
    compatibility_basis:
      - Ampere remains supported by current CUDA architecture documentation.
      - Static lower-bound arithmetic leaves about 16.37 GiB in a decimal 40 GB device before uncounted runtime allocations.
      - Root disk is far larger than the approximately 16.4 GB model repository.
    blockers:
      - Peak VRAM at 40,960 context has not been measured; CUDA graphs and allocator reserve could reduce headroom.
      - Expected latency is unmeasured and may make a short hard deadline less reliable than H100.
    t11_gates:
      - Validate a dry-run memory budget and define an OOM stop condition.
      - Prefer H100 for the first smoke unless current availability or an explicit cost decision selects A100.

global_t11_gates:
  - No row in this matrix is launch authorization.
  - Resolve current provider instance type IDs, regions, and image IDs from read-only metadata.
  - Confirm the exact driver and CUDA versions supplied by the selected image.
  - Preserve argument arrays; do not pass secrets or paths through word-split shell strings.
  - Set concurrency to one for the one-row smoke.
  - Attach durable storage at instance creation or explicitly authorize a no-filesystem transfer plan.
  - Enforce at least max(150 GB, 20 percent of capacity) free on every writable local or attached filesystem before and during the run; T11 may choose a stricter floor.
  - Recalculate price, wall-time ceiling, spend cap, tax treatment, and persistent-storage cost.
  - Keep GH200 excluded unless ARM compatibility is positively demonstrated.
