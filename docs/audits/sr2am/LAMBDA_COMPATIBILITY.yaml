status_definitions:
  preferred-pending-preflight: >-
    Best static choice, but T11 must still produce and dry-run a coherent
    environment lock and verify the current provider image/driver contract.
  eligible-pending-preflight: >-
    Static hardware and architecture evidence is favorable, but the exact
    environment has not been installed or executed.
  eligible-not-minimal: >-
    Likely compatible but has unnecessary GPU count, cost, or topology for the
    one-task smoke.
  arm-unproven-do-not-select: >-
    Memory is sufficient, but the complete frozen environment and auxiliary
    container path are not proven on arm64.

