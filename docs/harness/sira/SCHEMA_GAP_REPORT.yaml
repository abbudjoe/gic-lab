schema_version: 0.1.0
report_id: SIRA-ADAPTER-SCHEMA-GAPS-0.1.0
status: proposed-nonexecuting
source:
  manifest_id: SRC-SIRA-REPOSITORY
  commit: 93fb8d72de71f9a4a13419670adeb34d93cf7acd
  command_contract: docs/audits/sira/COMMAND_CONTRACT.yaml
  trace_field_map: docs/audits/sira/TRACE_FIELD_MAP.yaml
adapter_scope:
  structured_input: session_json
  webarena_output_jsonl: >-
    conditionally required as exactly one strict row; instance_id, goal, and test_result
    must equal the reconciled session before canonical outcome or metric emission
  raw_retention: every-regular-file-under-owned-sira-output-directory
  external_source_logs: declared-unowned-and-hard-blocked-before-execution
  text_log_parsing: forbidden
  evaluator_artifact_parsing: not-in-agent-session-adapter
  fixture_provenance: synthetic-contract-fixture
  upstream_sample_trace_available: false
identity_gates:
  source_checkout:
    rule: exact-clean-git-top-level-at-audited-commit-plus-prelaunch-tree-digest-recheck
    failure_effect: command-construction-or-preflight-refusal
  source_specific_config:
    rule: canonical-SiRA-config-SHA-256-must-equal-run-plan-config_sha256
    failure_effect: command-construction-and-normalization-refusal
  model_revision:
    rule: plan-must-record-null-because-the-audited-gpt-4o-alias-has-no-immutable-revision
    failure_effect: adapter-refusal-if-a-revision-is-claimed
  dataset_revision:
    rule: exact-task-revision-must-equal-run-plan-dataset_revision
    failure_effect: adapter-refusal
  reviewed_fanout_pilot:
    rule: >-
      data_root must be data; one-row slices must be exactly index 0 or 1; expected_goal
      must equal the corresponding question recorded in T01 COMMAND_CONTRACT.yaml
    failure_effect: configuration-refusal
  unsupported_pilot_commands:
    rule: FlightQA and WebArena remain typed normalization contexts but build_command refuses them
    failure_effect: command-construction-refusal
  trace_task:
    rule: >-
      exact goal, profile, history bound, observation/obs_info goal, duplicate action,
      prior-action link, plan/intent equality, final-action completion, instance
      identity, and WebArena reward/result derivation are reconciled
      with the exact single-row WebArena output.jsonl summary when applicable
    failure_effect: normalization-refusal
execution_gaps:
  - unit: cost_usd
    status: applicable-unbounded
    direct_source_path: null
    reason: >-
      The pinned CLI has no finite total API-cost control, and structured output has no
      complete cost accounting.
    execution_effect: hard-preflight-blocker
  - unit: model_tokens
    status: applicable-unbounded
    direct_source_path: null
    reason: >-
      The pinned CLI has no finite total token control and its clustering retry loop is
      unbounded.
    execution_effect: hard-preflight-blocker
  - unit: tool_calls
    status: finitely-projected-accounting-unavailable
    direct_source_path: history[*][1]
    reason: >-
      --max_steps bounds requested browser actions, but the generic tool-call total is
      not explicitly emitted and is therefore attested unavailable rather than counted
      under broader semantics.
    execution_effect: charge-at-command-projection-if-a-future-wrapper-closes-other-gaps
canonical_envelope_fields:
  schema_version:
    direct_source_path: null
    normalization_rule: supplied by the generic harness schema
    provenance: derived
    status: harness-owned
    missing_behavior: adapter-cannot-supply
  run_id:
    direct_source_path: null
    normalization_rule: supplied from the authorized run plan
    provenance: derived
    status: harness-owned
    missing_behavior: adapter-cannot-supply
  sequence:
    direct_source_path: null
    normalization_rule: assigned by the append-only run session
    provenance: derived
    status: harness-owned
    missing_behavior: adapter-cannot-supply
  timestamp_utc:
    direct_source_path: null
    normalization_rule: generated by the harness when committing the event
    provenance: derived
    status: harness-owned
    missing_behavior: upstream step UTC time remains unavailable
  source:
    direct_source_path: session artifact identity
    normalization_rule: fixed adapter source label sira-session-json
    provenance: derived
    status: available
    missing_behavior: normalization-refused-without-one-session-artifact
  provenance:
    direct_source_path: docs/audits/sira/TRACE_FIELD_MAP.yaml
    normalization_rule: fixed per field contract; never inferred
    provenance: derived
    status: available
    missing_behavior: normalization-refused-if-untyped
canonical_events:
  run_started:
    producer: harness
    fields:
      - field: event
        direct_source_path: null
        normalization_rule: emitted from retained run-plan identity before launch
        provenance: observed
        status: harness-owned
        missing_behavior: adapter-cannot-supply
  preflight_completed:
    producer: harness
    fields:
      - field: event
        direct_source_path: null
        normalization_rule: emitted from authorization and command preflight
        provenance: derived
        status: harness-owned
        missing_behavior: adapter-cannot-supply
  command_started:
    producer: harness
    fields:
      - field: event
        direct_source_path: null
        normalization_rule: emitted only after successful subprocess launch
        provenance: observed
        status: harness-owned
        missing_behavior: adapter-cannot-supply
  command_completed:
    producer: harness
    fields:
      - field: event
        direct_source_path: null
        normalization_rule: emitted from supervised process completion
        provenance: observed
        status: harness-owned
        missing_behavior: adapter-cannot-supply
  observation:
    producer: sira-adapter
    fields:
      - field: step_index
        direct_source_path: null
        normalization_rule: enumerate session history in source order from zero
        provenance: derived
        status: derived
        missing_behavior: no-event-without-history-item
      - field: raw_observation
        direct_source_path: history[*][0]
        normalization_rule: copy the complete structured observation mapping without semantic inference
        provenance: observed
        status: available
        missing_behavior: malformed-trace
      - field: processed_observation
        direct_source_path: history[*][2].obs
        normalization_rule: copy source text without parsing
        provenance: observed
        status: conditional
        missing_behavior: explicit-unavailable-field
      - field: observation_info
        direct_source_path: history[*][2].obs_info
        normalization_rule: copy the complete structured mapping without semantic inference
        provenance: observed
        status: conditional
        missing_behavior: explicit-unavailable-field
      - field: timestamp_utc
        direct_source_path: null
        normalization_rule: >-
          forbidden as a source step field; the harness event timestamp records evidence
          commit time and must not be relabeled as the unavailable upstream step UTC time
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field
      - field: observation_after_action
        direct_source_path: null
        normalization_rule: >-
          forbidden; only the next pre-action observation is retained and it is not
          relabeled as a structured result of the preceding action
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field
  belief_state:
    producer: sira-adapter
    fields:
      - field: step_index
        direct_source_path: null
        normalization_rule: enumerate session history in source order from zero
        provenance: derived
        status: derived
        missing_behavior: no-event-without-history-item
      - field: upstream_state
        direct_source_path: history[*][2].state
        normalization_rule: copy source-named natural-language state without relabeling it as GIC state
        provenance: observed
        status: conditional
        missing_behavior: explicit-unavailable-field-and-no-event
      - field: semantic_caveat
        direct_source_path: null
        normalization_rule: attach the T01 semantic boundary for source-named state
        provenance: derived
        status: derived
        missing_behavior: no-event-without-upstream-state
      - field: gic_state
        direct_source_path: null
        normalization_rule: forbidden; upstream state is not relabeled as GIC state
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field
      - field: belief_uncertainty
        direct_source_path: null
        normalization_rule: forbidden; no calibrated uncertainty is emitted
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field
  candidate_action:
    producer: none
    fields:
      - field: structured_candidate_action_set
        direct_source_path: null
        normalization_rule: forbidden; unstructured log text is retained raw only
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field-and-no-event
      - field: stable_candidate_action_ids
        direct_source_path: null
        normalization_rule: forbidden; upstream emits no stable IDs
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field-and-no-event
  predicted_future:
    producer: none
    fields:
      - field: structured_action_conditioned_futures
        direct_source_path: null
        normalization_rule: forbidden; Proposed Action/Next State text remains raw only
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field-and-no-event
      - field: stable_prediction_ids
        direct_source_path: null
        normalization_rule: forbidden; upstream emits no stable IDs
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field-and-no-event
      - field: confidence
        direct_source_path: null
        normalization_rule: forbidden; upstream emits no prediction confidence
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field-and-no-event
  critic_evaluation:
    producer: none
    fields:
      - field: structured_per_candidate_scores
        direct_source_path: null
        normalization_rule: >-
          forbidden; aggregate Reward/Thought Example text lacks stable complete
          candidate/sample association and remains raw only
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field-and-no-event
  plan:
    producer: sira-adapter
    fields:
      - field: step_index
        direct_source_path: null
        normalization_rule: enumerate session history in source order from zero
        provenance: derived
        status: derived
        missing_behavior: no-event-without-history-item
      - field: selected_plan_text
        direct_source_path: history[*][2].plan
        normalization_rule: copy the source-selected plan without candidate expansion
        provenance: observed
        status: conditional
        missing_behavior: explicit-unavailable-field
      - field: upstream_policy_output_alias
        direct_source_path: history[*][2].intent
        normalization_rule: copy only after exact equality with the selected plan is verified
        provenance: observed
        status: conditional
        missing_behavior: explicit-unavailable-field
      - field: plan_id
        direct_source_path: null
        normalization_rule: forbidden; upstream emits no stable plan ID
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field
      - field: candidate_action_ids
        direct_source_path: null
        normalization_rule: forbidden; upstream emits no stable candidate IDs
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field
  executed_action:
    producer: sira-adapter
    fields:
      - field: step_index
        direct_source_path: null
        normalization_rule: enumerate session history in source order from zero
        provenance: derived
        status: derived
        missing_behavior: no-event-without-history-item
      - field: requested_action
        direct_source_path: history[*][1]
        normalization_rule: copy as requested action only; never claim a structured execution result
        provenance: observed
        status: available
        missing_behavior: malformed-trace
      - field: duplicate_step_action
        direct_source_path: history[*][2].action
        normalization_rule: copy only after exact equality with the requested action is verified
        provenance: observed
        status: available
        missing_behavior: malformed-trace
      - field: action_result
        direct_source_path: null
        normalization_rule: forbidden; upstream emits no structured execution result
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field
      - field: candidate_action_id
        direct_source_path: null
        normalization_rule: forbidden; upstream emits no stable candidate ID
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field
  outcome:
    producer: sira-adapter
    fields:
      - field: source_is_complete
        direct_source_path: is_complete
        normalization_rule: copy after reconciling the source heuristic with the final requested action
        provenance: observed
        status: available
        missing_behavior: malformed-trace
      - field: source_error
        direct_source_path: error
        normalization_rule: copy source error text including the observed empty string
        provenance: observed
        status: available
        missing_behavior: malformed-trace
      - field: webarena_rewards
        direct_source_path: rewards
        normalization_rule: copy the WebArena reward list without aggregation
        provenance: observed
        status: conditional-webarena
        missing_behavior: explicit-unavailable-field-for-non-webarena
      - field: webarena_test_result
        direct_source_path: test_result
        normalization_rule: >-
          copy after exact reconciliation with float(max(rewards) > 0) and output.jsonl
        provenance: observed
        status: conditional-webarena
        missing_behavior: explicit-unavailable-field-for-non-webarena
      - field: generic_environment_result
        direct_source_path: null
        normalization_rule: forbidden for open-ended, FanOut, and FlightQA session traces
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field
      - field: fanout_evaluator_outcome
        direct_source_path: fanout_evaluation_csv.outcome
        normalization_rule: unavailable from the agent session; requires a separate evaluator adapter
        provenance: unavailable
        status: unavailable-in-session-adapter
        missing_behavior: explicit-unavailable-field-and-retain-separate-artifact
      - field: flight_evaluator_outcome
        direct_source_path: flight_evaluation_json[*].outcome
        normalization_rule: unavailable from the agent session; requires a separate evaluator adapter
        provenance: unavailable
        status: unavailable-in-session-adapter
        missing_behavior: explicit-unavailable-field-and-retain-separate-artifact
      - field: scientific_outcome
        direct_source_path: null
        normalization_rule: never emitted by this adapter
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field
  metric:
    producer: sira-adapter
    fields:
      - field: webarena_rewards
        direct_source_path: rewards
        normalization_rule: copy the WebArena reward list without aggregation
        provenance: observed
        status: conditional-webarena
        missing_behavior: explicit-unavailable-field
      - field: webarena_test_result
        direct_source_path: test_result
        normalization_rule: >-
          copy after exact reconciliation with float(max(rewards) > 0) and output.jsonl
        provenance: observed
        status: conditional-webarena
        missing_behavior: explicit-unavailable-field
      - field: fanout_record_accuracy
        direct_source_path: fanout_evaluation_csv.acc
        normalization_rule: separate FanOut evaluator CSV is outside this session adapter
        provenance: unavailable
        status: unavailable
        missing_behavior: retain-separate-artifact-and-use-future-evaluator-adapter
      - field: flight_grounded
        direct_source_path: flight_evaluation_json[*].grounded
        normalization_rule: separate Flight evaluator JSON is outside this session adapter
        provenance: unavailable
        status: unavailable
        missing_behavior: retain-separate-artifact-and-use-future-evaluator-adapter
      - field: flight_relevant
        direct_source_path: flight_evaluation_json[*].relevant
        normalization_rule: separate Flight evaluator JSON is outside this session adapter
        provenance: unavailable
        status: unavailable
        missing_behavior: retain-separate-artifact-and-use-future-evaluator-adapter
      - field: fanout_aggregate_scores
        direct_source_path: fanout_evaluator_stdout_stderr
        normalization_rule: aggregate stdout remains raw-only and is not parsed into a metric
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field-and-retain-raw
      - field: flight_aggregate_scores
        direct_source_path: flight_evaluator_stdout_stderr
        normalization_rule: aggregate stdout remains raw-only and is not parsed into a metric
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field-and-retain-raw
      - field: webarena_helper_aggregates
        direct_source_path: webarena_helper_stdout_stderr
        normalization_rule: helper aggregate stdout remains raw-only and is not parsed into a metric
        provenance: unavailable
        status: unavailable
        missing_behavior: explicit-unavailable-field-and-retain-raw
  budget_update:
    producer: harness
    fields:
      - field: nonwall_accounting
        direct_source_path: null
        normalization_rule: >-
          cost, model-token, and generic tool-call values are attested unavailable;
          GPU use is observed not applicable at zero
        provenance: unavailable
        status: harness-owned-from-adapter-attestation
        missing_behavior: sealing-refused-without-attestation
  artifact_recorded:
    producer: harness
    fields:
      - field: artifact_identity
        direct_source_path: owned raw file bytes
        normalization_rule: hash every retained file after normalization
        provenance: derived
        status: harness-owned
        missing_behavior: sealing-refused-for-unowned-or-missing-files
  warning:
    producer: harness
    fields:
      - field: unavailable_field
        direct_source_path: adapter normalization result
        normalization_rule: emit one typed warning for every explicit unavailable field
        provenance: unavailable
        status: harness-owned-from-adapter-gap
        missing_behavior: adapter-result-invalid
      - field: source_warning
        direct_source_path: history[*][2].obs_info.error_prefix or history[*][0].last_action_error
        normalization_rule: emit only nonempty source text through the typed adapter-notice channel
        provenance: derived
        status: conditional-harness-owned-from-adapter-notice
        missing_behavior: no-event-for-empty-source-text
  error:
    producer: harness
    fields:
      - field: operational_error
        direct_source_path: error or history[*][2].obs_info.return_action
        normalization_rule: >-
          emit nonempty observed source text through the typed adapter-notice channel;
          keep control-event production harness-owned
        provenance: observed
        status: conditional-harness-owned-from-adapter-notice
        missing_behavior: no-event-for-empty-source-text
  run_stopped:
    producer: harness
    fields:
      - field: event
        direct_source_path: null
        normalization_rule: emitted after evidence sealing
        provenance: observed
        status: harness-owned
        missing_behavior: adapter-cannot-supply
  cloud_instance_launched:
    producer: none
    fields:
      - field: event
        direct_source_path: null
        normalization_rule: not applicable to the local SiRA adapter
        provenance: unavailable
        status: not-applicable
        missing_behavior: no-event
  cloud_instance_terminated:
    producer: none
    fields:
      - field: event
        direct_source_path: null
        normalization_rule: not applicable to the local SiRA adapter
        provenance: unavailable
        status: not-applicable
        missing_behavior: no-event
raw_only_gaps:
  - artifact: agent_text_log
    source_path: src/sira/web/logs/YYYY-MM-DD-HH-MM-SS-microseconds.log
    reason: unstructured text has no stable complete candidate/prediction/critic associations
    command_contract: unowned_output_patterns
    execution_effect: hard-preflight-blocker
    fixture_disposition: isolated synthetic shape retained under sira-output/isolated-source-logs
  - artifact: global_text_log
    source_path: logs/sira_YYYY-MM-DD.log
    reason: unstructured shared log is not attempt-owned
    command_contract: unowned_output_patterns
    execution_effect: hard-preflight-blocker
    fixture_disposition: isolated synthetic shape retained under sira-output/isolated-source-logs
  - artifact: evaluator_outputs
    source_path: evaluation/*/results/*
    reason: separate entry points and overwrite-prone identities are outside this session adapter
    execution_effect: not-produced-by-the-agent-command
    required_future_action: use a separate source-grounded evaluator adapter and unique attempt paths
