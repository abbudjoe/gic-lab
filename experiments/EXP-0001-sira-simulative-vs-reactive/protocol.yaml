schema_version: 0.1.0
experiment_id: EXP-0001
title: SiRA simulative versus matched reactive behavior
question: >-
  Can both externally assigned SiRA conditions complete, retain, reconstruct, and
  deterministically score two counterbalanced frozen FanOutQA tasks within matched
  runtime and budget limits, and do observed task-level costs justify a larger pilot?
hypothesis:
  statement: >-
    This calibration pilot does not test a condition-superiority hypothesis. It
    supports planning a larger pilot only when all four attempts are reconstructable,
    the exact evaluator runs, pairs remain matched, and task-level completion and cost
    behavior are operationally informative.
  null_hypothesis: >-
    No statistical null is evaluated with two pairs. Failure of completion, scoring,
    matching, evidence, cleanup, or budget calibration makes a larger pilot unjustified
    until the identified operational cause is repaired under a new plan.
  falsification_criteria:
    - A task pair cannot be reconstructed or scored from retained evidence.
    - Pair matching, cleanup, credential handling, or the approved hard budget fails.
study_stage: exploratory
lifecycle_status: planned
evidence_status: not-evaluated
outcome_status: pending
owner: GIC Lab
created_at: "2026-08-08"
updated_at: "2026-08-13"
