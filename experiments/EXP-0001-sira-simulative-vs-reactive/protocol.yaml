schema_version: 0.1.0
experiment_id: EXP-0001
title: SiRA simulative versus matched reactive behavior
question: >-
  On the two preregistered FanOutQA development tasks, what is the paired difference
  in deterministic evaluator accuracy between externally assigned SIRA-SIMULATIVE and
  SIRA-REACTIVE behavior, and what model, browser-action, latency, and dollar costs
  accompany that difference?
hypothesis:
  statement: >-
    Exploratory evidence would favor SIRA-SIMULATIVE when its mean within-task
    accuracy difference over SIRA-REACTIVE is positive without being dominated on the
    declared success-cost measures.
  null_hypothesis: >-
    The mean within-task accuracy difference, SIRA-SIMULATIVE minus SIRA-REACTIVE, is
    less than or equal to zero, or any positive accuracy difference is dominated on
    the declared success-cost measures.
  falsification_criteria:
    - The mean paired accuracy difference is less than or equal to zero.
    - Any accuracy gain is dominated by SIRA-REACTIVE on every declared cost measure.
study_stage: exploratory
lifecycle_status: planned
evidence_status: not-evaluated
outcome_status: pending
owner: GIC Lab
created_at: "2026-08-08"
updated_at: "2026-08-08"
source_contracts:
  - docs/PROJECT_CHARTER.md
  - docs/RESEARCH_QUESTIONS.md
  - docs/FALSIFICATION_NOTES.md
  - docs/REPRODUCIBILITY.md
  - docs/H2K_OPTION_PRESERVATION.md
  - docs/audits/sira/UPSTREAM_AUDIT.md
