fixed_variables:
  upstream_source_id: SRC-SIRA-REPOSITORY
  upstream_commit: 93fb8d72de71f9a4a13419670adeb34d93cf7acd
  provider: OpenAI
  api: https://api.openai.com/v1/
  upstream_model_alias: gpt-4o
  proposed_model_revision: gpt-4o-2024-11-20
  reproduction_level: directional-reproduction
  agent: sira
  pilot_task_family: FanOutQA
  pilot_dataset_revision: 76ad1feb689b754bfe4e5e24d3ea371b647efa67
  outer_max_retry: 0
  action_timeout_seconds: 30
  dataset_order_seed: 42
  model_seed: unavailable
  pair_max_steps: 30
  expected_steps_per_attempt: 18
  condition_max_model_calls: 1155
  condition_max_model_tokens: 1000000
  condition_max_wall_seconds: 3600
  pair_max_wall_seconds: 7200
  total_max_wall_seconds: 14400
  retries_after_empirical_entry: 0
  interpretation: calibration-only-descriptive-task-level
metrics:
  primary: >-
    Per-attempt task completion, answer production, exact upstream FanOut evaluator
    validity and score, and reconstructability, reported separately for all four
    condition attempts with no aggregate effect estimate.
  secondary:
    - Task-level reactive and simulative scores shown descriptively, without a mean effect or superiority claim.
    - Provider input, cached-input, and output tokens when directly reported.
    - Provider cost in USD when directly reported or reproducibly derived from retained usage.
    - Harness wall time and upstream model-call count.
    - Browser action count and valid completion rate.
    - Availability of source-supported state and selected-plan fields, without internalization inference.
sampling:
  dataset_ids:
    - DATA-SIRA-FANOUTQA-DEV
  sample_size: 2
  replications: 1
  seeds:
    - 42
budget:
  max_model_tokens: 4000000
  max_tool_calls: 120
  max_gpu_hours: 4
  max_cost_usd: 45.16
acceptance_criteria:
  - All launched attempts are retained, hashed, scored or explicitly evaluator-invalid, and reconciled without retry.
  - Pair equality and only the source-declared treatment difference are machine verified.
  - Primary and secondary task-level fields are computed only from source-supported or observed retained evidence.
  - Results remain calibration-only and do not pass or fail EXP-0001.
validity:
  invalid_run_criteria:
    - Authorization was absent or a declared budget or safety boundary was violated.
    - Source, model, environment, task, configuration, pair, or evaluator identity drifted.
    - Required raw evidence, artifact hashes, or zero-live-child cleanup evidence is unavailable.
  inconclusive_criteria:
    - Either locked task lacks a contract-valid reactive/simulative evidence pair.
    - A task score cannot be reproduced from the exact retained evaluator input and output.
stop_conditions:
  - Stop before execution while authorization remains false.
  - Stop an authorized attempt before its call, token, OpenAI-cost, browser-step, wall, output, disk, Lambda-duration, Lambda-cost, attempt, or zero-retry cap is exceeded.
  - Stop before Task B whenever the predeclared Task-A continuation contract fails and preserve Task-A evidence.
  - Stop and classify the attempt infrastructure-invalid on source, configuration, task, model, environment, artifact, or pair-contract drift.
execution:
