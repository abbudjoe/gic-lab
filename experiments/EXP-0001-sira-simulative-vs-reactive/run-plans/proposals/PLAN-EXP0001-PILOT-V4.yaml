  normal_cleanup_reserve_seconds: 900
  provider_termination_cutoff_seconds: 13500
  post_condition_evaluator_evidence_seconds: 600
  termination_dispatch_margin_seconds: 60
  max_lambda_instances: 1
  max_launch_count: 1
  persistent_filesystems: 0
  admission_rule: remaining campaign time must cover only the next 3600-second condition hard wall, a 600-second evaluator/evidence handoff, a positive 60-second provider-termination dispatch margin, and the 900-second cleanup reserve
  control_plane: existing T07 pragmatic Lambda operations with source-derived projections; no persistent framework or watchdog
replacement_image_policy:
  historical_image_digest: sha256:035edf61718e84a8156f4f0f7817b134b0ce31488d3f0b50bbfba2b4a30cc61c
  exact_historical_digest_equality_required: false
  candidate_builds_normally: 1
  candidate_qualifications_normally: 1
  source_inputs: exact reviewed T07 pragmatic runtime inputs plus the frozen V4 policy package
  acceptance: all functional identities and offline fixtures pass; digest inequality alone is not a scientific difference
  freeze_sequence: clean V4 source-plan package first; then one source-derived mode-0600 O_EXCL frozen run manifest binds the exact built image before empirical entry
  authoritative_runtime_identity: frozen-run-manifest replacement_image_id
  all_attempts_same_image_required: true
  image_export: best effort only; abandon before cleanup reserve is threatened
artifacts:
  root: artifacts/EXP-0001/pilot-v4
  retain_raw: true
  public_release: blocked-pending-review
condition_plan_paths:
  - experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-v4-task-0000-reactive.yaml
  - experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-v4-task-0000-simulative.yaml
  - experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-v4-task-0001-simulative.yaml
  - experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-v4-task-0001-reactive.yaml
readiness:
  execution_eligibility: eligible-after-authorization
  approval_changes_required:
    - execution.authorized
    - execution.authorization_reference
    - condition_plans[*].execution.authorization
  unresolved_execution_blockers: []
  pre_execution_requirements:
    - Bind the exact clean package commit, final plan SHA-256, fresh V4 identities, and current Retry 2 authority in a single-use private overlay.
    - Build once and pass the source-bound replacement-image, offline evaluator, local browser, exact model metadata, pair-diff, science-hash, cap, evidence, repository, and privacy gates before empirical entry.
    - Freeze the exact accepted image and all qualification receipt hashes in the source-derived mode-0600 frozen run manifest; every attempt must reload it and use the exact image ID.
    - Start no attempt unless its 3,600-second condition wall, 600-second evaluator/evidence handoff, 60-second termination-dispatch margin, and 900-second cleanup reserve fit in actual remaining campaign time.
    - Keep raw task, answer, trace, screenshot, and evaluator evidence private and access controlled; public release remains blocked pending review.
