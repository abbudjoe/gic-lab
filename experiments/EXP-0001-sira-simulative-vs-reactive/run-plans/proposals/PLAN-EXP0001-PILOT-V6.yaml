provider_lifecycle:
  cumulative_accounting_origin: actual-active-lambda-seconds
  preflight_clock_origin: provider-launch-send-started
  preflight_wall_seconds: 3600
  failed_preflight_termination_dispatch_seconds: 300
  empirical_clock_origin: after-durable-frozen-run-manifest-publication
  empirical_campaign_wall_seconds: 14400
  empirical_cleanup_reserve_seconds: 900
  empirical_termination_cutoff_seconds: 13500
  maximum_successful_host_active_seconds: 18000
  maximum_cumulative_active_seconds: 21600
  max_lambda_instances: 1
  max_launch_count: 2
  persistent_filesystems: 0
  replacement_launch_rule:
    allowed_only_before_empirical_entry: true
    prior_instance_terminal_and_absent_required: true
    prior_host_empirical_attempts_required: 0
    prior_host_model_requests_required: 0
    prior_host_browser_actions_required: 0
    ownership_outcome_unknown_forbidden: true
    cumulative_lambda_cap_required: true
  admission_rule: remaining campaign time must cover only the next 3600-second condition hard wall and the 900-second cleanup reserve; downstream evaluator, evidence, and dispatch phases remain bounded but are not empirical-admission blockers
  control_plane: existing T07 pragmatic Lambda operations with source-derived projections; no persistent framework or watchdog
replacement_image_policy:
  historical_image_digest: sha256:035edf61718e84a8156f4f0f7817b134b0ce31488d3f0b50bbfba2b4a30cc61c
  exact_historical_digest_equality_required: false
  candidate_builds_normally: 0
  candidate_qualifications_normally: 1
  source_inputs: exact reviewed T07 pragmatic runtime inputs plus the frozen V6 policy package and the retained Retry 3 image archive
  acceptance: all functional identities and offline fixtures pass; digest inequality alone is not a scientific difference
  freeze_sequence: clean V6 source-plan package first; then one source-derived mode-0600 O_EXCL frozen run manifest binds the exact loaded or fallback-built image before the empirical clock begins
  authoritative_runtime_identity: frozen-run-manifest replacement_image_id
  all_attempts_same_image_required: true
  image_export: best effort only; abandon before cleanup reserve is threatened
raw_attempt_policy:
  empirical_authority: immutable condition-owned raw directory, SHA-256 manifest, raw-attempt-complete receipt, and independently verified per-attempt archive
  next_attempt_gate: prior condition terminated, raw evidence is reconstructable, raw manifest revalidates, exact credentials are absent, container and browser cleanup are clean, off-host archive acknowledgement exists, and remaining budgets admit the next attempt plus cleanup
  downstream_finalizer: network-disabled, explicit qualified-image or prequalified absolute local Python, exact frozen evaluator overlay, read-only raw and control inputs, fresh versioned finalized-output root
  offhost_reconstruction: each verified raw export carries a hash-bound control snapshot sufficient to restore the exact raw prefix and run the prelaunch control-machine-qualified local finalizer after provider termination; Lambda validates the qualification receipt without dereferencing off-host paths and local use preserves and revalidates the absolute venv launcher, link target, resolved executable, venv purelib, and both dependency trees
  repair_policy: downstream-only descendant commits may rerun the finalizer against immutable raw evidence; they may not rerun a condition, alter raw bytes, change scoring, or make a model or browser request
  uniform_analysis: the same full finalizer/interpreter/dependency/evaluator closure must be selected for both members of a pair and for every retained campaign attempt before final analysis
  aggregate_staging: per-attempt raw archives are authoritative; structural fixture or private-only findings are adjudicated and block public release but do not block private preservation or provider termination; an exact credential match remains a hard stop
