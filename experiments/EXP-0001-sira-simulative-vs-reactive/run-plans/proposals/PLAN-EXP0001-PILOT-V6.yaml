readiness:
  execution_eligibility: eligible-after-authorization
  approval_changes_required:
    - execution.authorized
    - execution.authorization_reference
    - condition_plans[*].execution.authorization
  unresolved_execution_blockers: []
  pre_execution_requirements:
    - Bind the exact clean package commit, final plan SHA-256, fresh V6 identities, and current Retry 4 authority in a single-use private overlay.
    - Load the retained image archive, or build once only if loading is unavailable, and pass the source-bound runtime, evaluator, browser, model-metadata, pair-diff, science-hash, cap, evidence, repository, and privacy gates before empirical entry.
    - Freeze the exact accepted image and all qualification receipt hashes in the source-derived mode-0600 frozen run manifest; every attempt must reload it and use the exact image ID.
    - Start no attempt unless its 3,600-second condition wall and 900-second cleanup reserve fit in actual remaining campaign time; keep downstream evaluator, evidence, and dispatch phases bounded without making them empirical-admission blockers.
    - Keep raw task, answer, trace, screenshot, and evaluator evidence private and access controlled; public release remains blocked pending review.
