profile: pilot
study_stage: exploratory
purpose: Calibrate full-task completion, exact upstream scoring, matched-pair execution, reconstruction, task-level resource use, and larger-pilot feasibility on two locked tasks.
sample_rationale: Two counterbalanced pairs can expose pipeline, scoring, completion, gross floor or ceiling, and cost failures; they cannot estimate an effect, variance, significance, condition superiority, or EXP-0001 outcome.
