provider_lifecycle:
  cumulative_accounting_origin: actual-active-lambda-seconds
  preflight_clock_origin: provider-launch-send-started
  failed_preflight_termination_dispatch_seconds: 300
  empirical_clock_origin: after-durable-frozen-run-manifest-publication
  empirical_campaign_wall_seconds: 14400
  evidence_export_reserve_seconds: 600
  provider_termination_handoff_seconds: 60
  empirical_cleanup_reserve_seconds: 900
  empirical_termination_cutoff_seconds: 13500
  max_lambda_instances: 1
  persistent_filesystems: 0
  replacement_launch_rule:
    allowed_only_before_empirical_entry: true
    prior_instance_terminal_and_absent_required: true
    prior_host_empirical_attempts_required: 0
    prior_host_model_requests_required: 0
    prior_host_browser_actions_required: 0
    ownership_outcome_unknown_forbidden: true
    cumulative_lambda_cap_required: true
  admission_rule: remaining campaign time must cover the next 3600-second condition
    hard wall, 600-second direct evidence export, 60-second provider termination handoff,
    and 900-second cleanup reserve
  supervised_release_wait_seconds: 300
  supervised_release_rule: the credential-free started entrypoint may wait up to 300
    seconds for the final source-bound state, budget, core, exact-secret, and owned-container
    checks; the 5160-second admission gate is rerun immediately before durable release
    and any timeout consumes the started identity as infrastructure-invalid
  control_plane: autonomous-v13-explicit-pilot-contract-binding
  preflight_iteration_wall_seconds: 3600
  maximum_preflight_instance_active_seconds: 21600
  maximum_cumulative_preflight_active_seconds: 43200
  maximum_preflight_provider_cost_usd: 10.0
  max_preflight_launch_count: 8
  maximum_empirical_provider_cost_usd: 8.0
  max_empirical_launch_count: 1
  model_metadata_request_count_total: 1
  model_metadata_request_location: local-control-plane-before-lambda-launch
  provider_launch_model_metadata_request_count: 0
  host_runtime_model_metadata_request_count: 0
  model_metadata_prelaunch_freshness_seconds: 1800
  model_metadata_freshness_owner: provider-final-transport-boundary
  provider_launch_requires_current_freshness: true
  host_runtime_requires_current_freshness: false
  host_runtime_requires_prelaunch_timestamp_ordering: true
  model_metadata_receipt_required: true
  model_metadata_receipt_replay_allowed: false
  immutable_model_unavailable_disposition: stop-before-lambda-launch-zero-lambda-cost
replacement_image_policy:
  historical_image_digest: sha256:035edf61718e84a8156f4f0f7817b134b0ce31488d3f0b50bbfba2b4a30cc61c
  exact_historical_digest_equality_required: false
  candidate_builds_normally: 0
  candidate_qualifications_normally: 1
  source_inputs: exact reviewed T07 pragmatic runtime inputs plus the frozen V13 policy
    package and the retained verified Retry 3 image archive
  acceptance: all functional identities and offline fixtures pass; digest inequality
    alone is not a scientific difference
  freeze_sequence: clean V13 source-plan package first; then one source-derived mode-0600
    O_EXCL frozen run manifest binds the exact loaded or fallback-built image and
    the core-suppression receipts before the empirical clock begins
  authoritative_runtime_identity: frozen-run-manifest replacement_image_id
  all_attempts_same_image_required: true
  image_export: best effort only; abandon before cleanup reserve is threatened
  fallback_build_second_launch_policy: prefer the retained verified archive; rebuild
    from frozen inputs when loading is unavailable, corrupt, or slower; keep one accepted
    image unchanged across all four empirical attempts and never delay provider cleanup
    for image export
raw_attempt_policy:
  empirical_authority: immutable condition-owned raw directory, SHA-256 manifest,
    raw-attempt-complete receipt, independently verified per-attempt archive, and
    separate source-bound export-completion plus off-host-verification timestamps
    that final packaging compares with provider termination start
  next_attempt_gate: prior condition terminated, raw evidence is reconstructable,
    raw manifest revalidates, exact credentials are absent, container and browser
    cleanup are clean, off-host archive acknowledgement exists, and remaining budgets
    admit the next attempt plus cleanup
  downstream_finalizer: network-disabled, explicit qualified-image or prequalified
    absolute local Python, exact frozen evaluator overlay, read-only raw and control
    inputs, fresh versioned finalized-output root
  offhost_reconstruction: each verified raw export carries a hash-bound control snapshot
    sufficient to restore the exact raw prefix and run the prelaunch control-machine-qualified
    local finalizer after provider termination; Lambda validates the qualification
    receipt without dereferencing off-host paths and local use preserves and revalidates
    the absolute venv launcher, link target, resolved executable, venv purelib, and
    both dependency trees
  repair_policy: downstream-only descendant commits may rerun the finalizer against
    immutable raw evidence; they may not rerun a condition, alter raw bytes, change
    scoring, or make a model or browser request
  uniform_analysis: the same full finalizer/interpreter/dependency/evaluator closure
    must be selected for both members of a pair and for every retained campaign attempt
    before final analysis
  aggregate_staging: per-attempt raw or essential-failure archives are authoritative
    and every consumed identity must have a durable export completion plus off-host
    verification acknowledgement before aggregate staging or ordinary global cleanup;
    the optional aggregate stage hash-binds and revalidates those embedded direct-export
    receipts before final packaging; structural fixture or private-only findings are
    adjudicated and block public release but do not block private preservation or
    provider termination; an exact credential match remains a hard stop
core_dump_policy:
  docker_ulimit: core=0:0
  process_soft_limit: 0
  process_hard_limit: 0
  scope: condition entrypoint and every Python, SiRA, Playwright, Chromium, evaluator,
    cleanup, child, and descendant process
  preentry_proof: exact-image synthetic SIGABRT plus child/grandchild inheritance
    and no-network browser teardown all produce zero core artifacts
  detection: known core filenames plus bounded ELF ET_CORE header inspection and full
    in-root inode-alias census; size alone never classifies a core
  disposition: prohibited-transient-security-artifact; exclude every owned inode alias
    from every archive; retain only safe metadata; destroy remotely; require rotation
    when destruction is unverifiable; any detected core permanently stops campaign
    continuation; a preflight core blocks launch without consuming a condition, while
    a core from any started condition consumes that condition identity even before
    its first task model request or browser action
failure_evidence_policy:
  full_attempt_cap_bytes: 536870912
  stdout_stderr_per_stream_cap_bytes: 536870912
  essential_failure_cap_bytes: 67108864
  authority: allowlisted privacy-safe reconstructable failure bundle with manifest
    and completion receipt
  stream_limit_disposition: reaching either attach-stream limit is an explicit infrastructure
    stop, never silent truncation or a successful raw seal
  scientific_status: infrastructure-invalid, unscored, excluded from paired analysis,
    and never retryable; whether empirical entry occurred is retained as a separate
    typed field
  preempirical_cap_identity: a condition-container output-cap or host-runner infrastructure
    stop consumes the next frozen identity even before its first task model request
    or browser action; it receives the same essential seal and permanently closes
    campaign admission
  exclusions: core dumps, dotenv files, temporary secret files, Jupyter credentials,
    private account fields, unsafe file types, nonallowlisted output, and over-cap
    members
evidence_cap_calibration:
  retry4_attempt_total_bytes: 236556320
  retry4_core_bytes: 234479616
  retry4_noncore_bytes: 2076704
  retained_attempt_cap_bytes: 536870912
  expected_full_attempt_evidence_bytes: 50331648
  expected_full_attempt_evidence_breakdown:
    thirty_screenshots_bytes: 31457280
    session_events_actions_answers_bytes: 8388608
    stdout_stderr_bytes: 4194304
    provider_runtime_cleanup_receipts_bytes: 4194304
    evaluator_schemas_and_manifests_bytes: 2097152
  remaining_cap_headroom_bytes: 486539264
  noncore_headroom_ratio: 258.5206712176
  conclusion: the symmetric 512 MiB cap preserves ordinary scientific evidence with
    more than 486 MiB beyond the conservative projection; prohibited core dumps and
    unrelated runtime state remain excluded
