  approval_changes_required: []
  unresolved_execution_blockers:
  - exact-head PR review
  - Category 2 merge
  - fresh Category 3 authorization
  pre_execution_requirements:
  - Before Lambda launch or any other paid cloud mutation, issue exactly one authenticated
    model-metadata GET for gpt-4o-2024-11-20; stop with zero Lambda cost when the
    immutable snapshot is unavailable, and do not substitute another model.
  - Bind the exact clean merged package commit, final plan SHA-256, fresh V13 identities,
    and a fresh Category 3 authorization; no prior authorization may be reused.
  - Pass the established exact-runtime checks plus the exact-container provider-call
    accounting regression before the scientific freeze.
  - Freeze one accepted image and all commands only after end-to-end preflight succeeds.
  - Start no attempt unless its hard wall and the 900-second cleanup reserve fit in
