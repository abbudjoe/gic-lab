schema_version: 0.1.0
experiment_id: EXP-0001
plan_id: PLAN-EXP0001-PILOT-V13
profile: pilot
study_stage: exploratory
purpose: Calibrate full-task completion, exact upstream scoring, matched-pair execution,
  reconstruction, task-level resource use, and larger-pilot feasibility on two locked
  tasks.
sample_rationale: Two counterbalanced pairs can expose pipeline, scoring, completion,
  gross floor or ceiling, and cost failures; they cannot estimate an effect, variance,
  significance, condition superiority, or EXP-0001 outcome.
interpretation_allowed: true
execution:
  authorized: false
  authorization_reference: null
model:
  provider: OpenAI
  manifest_id: MODEL-OPENAI-GPT4O-2024-11-20
  api: https://api.openai.com/v1/
  upstream_alias: gpt-4o
  proposed_immutable_revision: gpt-4o-2024-11-20
  historical_revision_known: false
  reproduction_level: directional-reproduction
  substitution: Exact historical serving revision is unavailable; use a declared dated
    GPT-4o snapshot.
sampling:
  pair_count: 2
  conditions:
  - SIRA-SIMULATIVE
  - SIRA-REACTIVE
  task_family: FanOutQA
  dataset_ids:
  - DATA-SIRA-FANOUTQA-DEV
  counterbalancing:
  - pair_id: PAIR-EXP0001-PILOT-V13-TASK-A
    task_id: 7dcbbbdc7f1120cd
    task_source: DATA-SIRA-FANOUTQA-DEV[0:1]
    first: SIRA-REACTIVE
    second: SIRA-SIMULATIVE
    plans:
    - condition: SIRA-REACTIVE
      path: experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-v13-task-0000-reactive.yaml
    - condition: SIRA-SIMULATIVE
      path: experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-v13-task-0000-simulative.yaml
  - pair_id: PAIR-EXP0001-PILOT-V13-TASK-B
    task_id: 2120afba8009bad3
    task_source: DATA-SIRA-FANOUTQA-DEV[1:2]
    first: SIRA-SIMULATIVE
    second: SIRA-REACTIVE
    plans:
    - condition: SIRA-SIMULATIVE
      path: experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-v13-task-0001-simulative.yaml
    - condition: SIRA-REACTIVE
      path: experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-v13-task-0001-reactive.yaml
