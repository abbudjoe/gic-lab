      task_id: 7dcbbbdc7f1120cd
      task_source: DATA-SIRA-FANOUTQA-DEV[0:1]
      first: SIRA-REACTIVE
      second: SIRA-SIMULATIVE
      plans:
        - condition: SIRA-REACTIVE
          path: experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-task-0000-reactive.yaml
        - condition: SIRA-SIMULATIVE
          path: experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-task-0000-simulative.yaml
    - pair_id: PAIR-EXP0001-PILOT-V3-TASK-B
      task_id: 2120afba8009bad3
      task_source: DATA-SIRA-FANOUTQA-DEV[1:2]
      first: SIRA-SIMULATIVE
      second: SIRA-REACTIVE
      plans:
        - condition: SIRA-SIMULATIVE
          path: experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-task-0001-simulative.yaml
        - condition: SIRA-REACTIVE
          path: experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-task-0001-reactive.yaml
