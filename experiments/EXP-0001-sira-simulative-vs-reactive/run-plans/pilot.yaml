    - A fresh user authorization must bind the final clean commit, PLAN-EXP0001-PILOT-V2 bytes and SHA-256, execution contract SHA-256, four command hashes, USD 45.16 aggregate cap, and zero-retry rule.
    - Run the single exact T09 preflight before empirical entry, including read-only current model metadata, Lambda price and zero-instance checks; a failure may be repaired only before the first task model request or browser action.
