provider_lifecycle:
  cumulative_accounting_origin: actual-active-lambda-seconds
  preflight_clock_origin: provider-launch-send-started
  preflight_wall_seconds: 3600
  failed_preflight_termination_dispatch_seconds: 300
  empirical_clock_origin: after-durable-frozen-run-manifest-publication
  empirical_campaign_wall_seconds: 14400
  empirical_cleanup_reserve_seconds: 900
  empirical_termination_cutoff_seconds: 13500
  maximum_successful_host_active_seconds: 18000
  maximum_cumulative_active_seconds: 21600
  max_lambda_instances: 1
  max_launch_count: 2
  persistent_filesystems: 0
  replacement_launch_rule:
    allowed_only_before_empirical_entry: true
    prior_instance_terminal_and_absent_required: true
    prior_host_empirical_attempts_required: 0
    prior_host_model_requests_required: 0
    prior_host_browser_actions_required: 0
    ownership_outcome_unknown_forbidden: true
    cumulative_lambda_cap_required: true
  admission_rule: remaining campaign time must cover only the next 3600-second condition hard wall and the 900-second cleanup reserve; downstream evaluator, evidence, and dispatch phases remain bounded but are not empirical-admission blockers
  control_plane: existing T07 pragmatic Lambda operations with source-derived projections; no persistent framework or watchdog
replacement_image_policy:
  historical_image_digest: sha256:035edf61718e84a8156f4f0f7817b134b0ce31488d3f0b50bbfba2b4a30cc61c
  exact_historical_digest_equality_required: false
  candidate_builds_normally: 0
  candidate_qualifications_normally: 1
  source_inputs: exact reviewed T07 pragmatic runtime inputs plus the frozen V7 policy package and the retained verified Retry 3 image archive
  acceptance: all functional identities and offline fixtures pass; digest inequality alone is not a scientific difference
  freeze_sequence: clean V7 source-plan package first; then one source-derived mode-0600 O_EXCL frozen run manifest binds the exact loaded or fallback-built image and the core-suppression receipts before the empirical clock begins
  authoritative_runtime_identity: frozen-run-manifest replacement_image_id
  all_attempts_same_image_required: true
  image_export: best effort only; abandon before cleanup reserve is threatened
raw_attempt_policy:
  empirical_authority: immutable condition-owned raw directory, SHA-256 manifest, raw-attempt-complete receipt, and independently verified per-attempt archive
  next_attempt_gate: prior condition terminated, raw evidence is reconstructable, raw manifest revalidates, exact credentials are absent, container and browser cleanup are clean, off-host archive acknowledgement exists, and remaining budgets admit the next attempt plus cleanup
  downstream_finalizer: network-disabled, explicit qualified-image or prequalified absolute local Python, exact frozen evaluator overlay, read-only raw and control inputs, fresh versioned finalized-output root
  offhost_reconstruction: each verified raw export carries a hash-bound control snapshot sufficient to restore the exact raw prefix and run the prelaunch control-machine-qualified local finalizer after provider termination; Lambda validates the qualification receipt without dereferencing off-host paths and local use preserves and revalidates the absolute venv launcher, link target, resolved executable, venv purelib, and both dependency trees
  repair_policy: downstream-only descendant commits may rerun the finalizer against immutable raw evidence; they may not rerun a condition, alter raw bytes, change scoring, or make a model or browser request
  uniform_analysis: the same full finalizer/interpreter/dependency/evaluator closure must be selected for both members of a pair and for every retained campaign attempt before final analysis
  aggregate_staging: per-attempt raw or essential-failure archives are authoritative; structural fixture or private-only findings are adjudicated and block public release but do not block private preservation or provider termination; an exact credential match remains a hard stop
core_dump_policy:
  docker_ulimit: core=0:0
  process_soft_limit: 0
  process_hard_limit: 0
  scope: condition entrypoint and every Python, SiRA, Playwright, Chromium, evaluator, cleanup, child, and descendant process
  preentry_proof: exact-image synthetic SIGABRT plus child/grandchild inheritance and no-network browser teardown all produce zero core artifacts
  detection: known core filenames plus bounded ELF ET_CORE header inspection and full in-root inode-alias census; size alone never classifies a core
  disposition: prohibited-transient-security-artifact; exclude every owned inode alias from every archive; retain only safe metadata; destroy remotely; require rotation when destruction is unverifiable; any detected core permanently stops campaign continuation and consumes the condition identity only when empirical entry occurred
failure_evidence_policy:
  full_attempt_cap_bytes: 67108864
  stdout_stderr_per_stream_cap_bytes: 67108864
  essential_failure_cap_bytes: 16777216
  authority: allowlisted privacy-safe reconstructable failure bundle with manifest and completion receipt
  stream_limit_disposition: reaching either attach-stream limit is an explicit infrastructure stop, never silent truncation or a successful raw seal
  scientific_status: infrastructure-invalid, unscored, excluded from paired analysis, and never retryable; whether empirical entry occurred is retained as a separate typed field
  preempirical_cap_identity: a condition-container output-cap or host-runner infrastructure stop consumes the next frozen identity even before its first task model request or browser action; it receives the same essential seal and permanently closes campaign admission
  exclusions: core dumps, dotenv files, temporary secret files, Jupyter credentials, private account fields, unsafe file types, nonallowlisted output, and over-cap members
evidence_cap_calibration:
  retry4_attempt_total_bytes: 236556320
  retry4_core_bytes: 234479616
  retry4_noncore_bytes: 2076704
  retained_attempt_cap_bytes: 67108864
  expected_full_attempt_evidence_bytes: 50331648
  expected_full_attempt_evidence_breakdown:
    thirty_screenshots_bytes: 31457280
    session_events_actions_answers_bytes: 8388608
    stdout_stderr_bytes: 4194304
    provider_runtime_cleanup_receipts_bytes: 4194304
    evaluator_schemas_and_manifests_bytes: 2097152
  remaining_cap_headroom_bytes: 16777216
  noncore_headroom_ratio: 32.3150839022
  conclusion: the existing symmetric cap provides 16 MiB beyond a conservative 48 MiB full-attempt projection and more than 32x observed Retry 4 non-core headroom; no increase is made for a prohibited core dump
