schema_version: 0.1.0
experiment_id: EXP-0001
plan_id: PLAN-EXP0001-PILOT
profile: pilot
study_stage: exploratory
purpose: Test paired execution, deterministic scoring, completion-rate measurement, and paired-variance plumbing on two locked tasks.
sample_rationale: Two pairs are the directional variance-plumbing minimum; they can expose scoring, completion, floor, ceiling, and cost failures but are not selected from an effect size or power claim.
interpretation_allowed: true
execution:
  authorized: false
  authorization_reference: null
model:
  provider: OpenAI
  manifest_id: MODEL-OPENAI-GPT4O-2024-11-20
  api: https://api.openai.com/v1/
  upstream_alias: gpt-4o
  proposed_immutable_revision: gpt-4o-2024-11-20
  historical_revision_known: false
  reproduction_level: directional-reproduction
  substitution: Exact historical serving revision is unavailable; use a declared dated GPT-4o snapshot.
sampling:
  pair_count: 2
  conditions:
    - SIRA-SIMULATIVE
    - SIRA-REACTIVE
  task_family: FanOutQA
  dataset_ids:
    - DATA-SIRA-FANOUTQA-DEV
  counterbalancing:
    - pair_id: PAIR-EXP0001-PILOT-0000
      task_id: 7dcbbbdc7f1120cd
      task_source: DATA-SIRA-FANOUTQA-DEV[0:1]
      first: SIRA-REACTIVE
      second: SIRA-SIMULATIVE
      plans:
        - condition: SIRA-REACTIVE
          path: experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-task-0000-reactive.yaml
        - condition: SIRA-SIMULATIVE
          path: experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-task-0000-simulative.yaml
    - pair_id: PAIR-EXP0001-PILOT-0001
      task_id: 2120afba8009bad3
      task_source: DATA-SIRA-FANOUTQA-DEV[1:2]
      first: SIRA-SIMULATIVE
      second: SIRA-REACTIVE
      plans:
        - condition: SIRA-SIMULATIVE
          path: experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-task-0001-simulative.yaml
        - condition: SIRA-REACTIVE
          path: experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-task-0001-reactive.yaml
budget:
  pricing_record: experiments/EXP-0001-sira-simulative-vs-reactive/pricing.yaml
  max_cost_usd: 40.00
  max_provider_compute_cost_usd: 5.16
  max_total_cost_usd: 45.16
  max_model_calls: 4620
  max_model_tokens: 4000000
  max_browser_actions: 120
  max_wall_seconds: 14400
  max_accelerator_hours: 4.0
  condition_limits:
    SIRA-REACTIVE:
      attempts: 2
      max_model_calls_per_attempt: 480
      max_model_tokens_per_attempt: 1000000
      max_browser_actions_per_attempt: 30
      max_wall_seconds_per_attempt: 3600
      max_openai_cost_usd_per_attempt: 10.00
      max_accelerator_hours_per_attempt: 1.0
    SIRA-SIMULATIVE:
      attempts: 2
      max_model_calls_per_attempt: 1830
      max_model_tokens_per_attempt: 1000000
      max_browser_actions_per_attempt: 30
      max_wall_seconds_per_attempt: 3600
      max_openai_cost_usd_per_attempt: 10.00
      max_accelerator_hours_per_attempt: 1.0
artifacts:
  root: artifacts/EXP-0001/pilot
  retain_raw: true
  public_release: blocked-pending-review
condition_plan_paths:
  - experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-task-0000-reactive.yaml
  - experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-task-0000-simulative.yaml
  - experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-task-0001-simulative.yaml
  - experiments/EXP-0001-sira-simulative-vs-reactive/run-plans/conditions/pilot-task-0001-reactive.yaml
readiness:
  execution_eligibility: blocked-pending-prerequisites
  approval_changes_required:
    - docs/PROJECT_STATE.yaml.paid_compute_allowed
    - docs/PROJECT_STATE.yaml.prototype_execution_allowed
    - execution.authorized
    - execution.authorization_reference
    - budget.max_cost_usd
    - budget.max_provider_compute_cost_usd
    - budget.max_total_cost_usd
    - condition_plans[*].execution.authorization
    - condition_plans[*].budget.max_cost_usd
    - condition_plans[*].budget.max_gpu_hours
  unresolved_execution_blockers:
    - A fresh user authorization must bind the final immutable pilot package and exact cost, time, model, browser, cleanup, and stopping limits.
    - FanOut spaCy and en_core_web_sm evaluator versions, hashes, licenses, and deterministic scorer behavior are not immutably pinned.
    - Current Lambda price, capacity, exact image, firewall, zero-instance state, and immutable model availability require fresh read-only reverification.
    - Final source, protocol, configuration, environment, container, browser, command, and condition-diff identities are not materialized.
    - The locked experiment protocol still records zero GPU hours; a separately reviewed version must reconcile that operational cap before any cloud authorization without changing the treatment, task, scoring, or interpretation contract.
    - Future provider evidence must structurally redact or omit ephemeral Jupyter access values while retaining safe lifecycle proof.
  pre_execution_requirements:
    - Materialize and enforce the declared per-condition model-call, token, browser-action, wall, API-spend, accelerator-hour, provider-spend, output, and aggregate caps before any empirical action.
    - Preserve source-log ownership, post-action browser evidence, normalized events, regulation-decision lineage, per-call provider receipts when available, and complete cleanup identities.
    - Revalidate the two-task frozen subset, counterbalanced order, task-level pairing, deterministic scoring, and no outcome-adaptive design changes.
    - Treat the T07 one-step smoke only as artifact-execution evidence; do not use its cost or trajectory as pilot outcome evidence.
